org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The instrumented suite leaves the app installed.
#
# `connectedAndroidTest` uninstalls both APKs when it finishes, which for this project is a
# nuisance with teeth: the device is then left with no Latch, and the next thing anyone does is
# a device pass that needs one — so the run that was supposed to increase confidence has taken
# the app away. It has caught people out here before.
#
# This is an AGP-injected property rather than a DSL block because there is no DSL for it. If a
# future AGP drops it, the symptom is the old behaviour and not a build failure, so the check is
# that the app is still on the device afterwards.
android.injected.androidTest.leaveApksInstalledAfterRun=true
