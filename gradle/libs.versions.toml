[versions]
agp = "9.3.2"
kotlin = "2.2.21"
jvmTarget = "17"

compileSdk = "37"
minSdk = "26"
targetSdk = "37"

androidxCore = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
# Pinned to what androidx already resolves onto the app classpath. Naming a higher version
# here would upgrade the whole graph as a side effect of a :data declaration.
coroutines = "1.9.0"
# The OAuth grant only; see docs/DEPENDENCIES.md. Measured at +135 KB.
playServicesAuth = "22.0.0"
# Test-only. The real org.json, standing in for the android.jar stub under JVM unit tests.
orgJson = "20260814"
# Instrumented, for the launch canary only. Never in the app APK.
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
androidxTestJunit = "1.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# Test-only. Virtual time, so FR-807's ten-second window is tested without waiting ten seconds.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }

org-json = { module = "org.json:json", version.ref = "orgJson" }

androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# The framework-bound variant. :parser gets it implicitly from the Kotlin JVM plugin;
# an Android module has to name it, because AGP does not drive kotlin-test's variant choice.
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
